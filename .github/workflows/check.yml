name: padel-check

on:
  # מושהה זמנית: האתר חוסם ריצות מהענן (HTTP 403). להפעלה מחדש להסיר את # משתי השורות:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:          # מאפשר הפעלה ידנית מכפתור

permissions:
  contents: write             # כדי לשמור את state.json

concurrency:
  group: padel-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pyyaml
      - name: Test push (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py --test-push
      - name: Run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py
      - name: Save state
        if: always()
        run: |
          git config user.name "padel-bot"
          git config user.email "padel-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
